<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: "Noto Sans JP", sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hero-slide {
      opacity: 0;
      transform: scale(1.08);
      transition: opacity 1200ms ease, transform 5200ms cubic-bezier(.2,.7,.2,1);
    }
    .hero-slide.is-active {
      opacity: 1;
      transform: scale(1);
    }
    .hero-panel {
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.24), transparent 28%),
        linear-gradient(135deg, #d6d3d1, #78716c);
    }
    .hero-panel.alt-1 {
      background:
        radial-gradient(circle at 74% 24%, rgba(255,255,255,.22), transparent 30%),
        linear-gradient(135deg, #a8a29e, #292524);
    }
    .hero-panel.alt-2 {
      background:
        radial-gradient(circle at 50% 22%, rgba(255,255,255,.2), transparent 32%),
        linear-gradient(135deg, #e7e5e4, #57534e);
    }
    .bottom-nav {
      opacity: 0;
      pointer-events: none;
      transform: translateY(100%);
      transition: opacity 360ms ease, transform 360ms ease;
    }
    .bottom-nav.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .concept-photo {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      background: #d4d4d8;
      color: #71717a;
      font-size: 11px;
      font-weight: 600;
    }
    details[open] .accordion-mark::before { content: "-"; }
    details:not([open]) .accordion-mark::before { content: "+"; }
  </style>
</head>
