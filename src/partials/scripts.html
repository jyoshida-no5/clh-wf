<script>
    if (window.lucide) {
      lucide.createIcons();
    }
    const slides = Array.from(document.querySelectorAll('.hero-slide'));
    const dots = Array.from(document.querySelectorAll('.hero-dot'));
    let currentSlide = 0;
    if (slides.length && dots.length) {
      setInterval(() => {
        slides[currentSlide].classList.remove('is-active');
        dots[currentSlide].className = 'hero-dot h-1.5 w-1.5 rounded-full bg-white/45';
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('is-active');
        dots[currentSlide].className = 'hero-dot h-1.5 w-6 rounded-full bg-white';
      }, 4200);
    }

    const phoneModal = document.getElementById('phone-modal');
    const phoneModalOpen = document.getElementById('phone-modal-open');
    const phoneModalCloseButtons = document.querySelectorAll('[data-phone-modal-close]');
    const menuModal = document.getElementById('menu-modal');
    const menuModalOpen = document.getElementById('menu-modal-open');
    const menuModalCloseButtons = document.querySelectorAll('[data-menu-modal-close]');
    const processModal = document.getElementById('process-modal');
    const processModalOpen = document.getElementById('process-modal-open');
    const processModalCloseButtons = document.querySelectorAll('[data-process-modal-close]');
    const techTabGroups = Array.from(document.querySelectorAll('[data-tech-tabs]'));
    const bottomNav = document.getElementById('bottom-nav');
    const toggleBottomNav = () => {
      if (window.scrollY > 120) {
        bottomNav.classList.add('is-visible');
      } else {
        bottomNav.classList.remove('is-visible');
      }
    };
    if (bottomNav) {
      toggleBottomNav();
      window.addEventListener('scroll', toggleBottomNav, { passive: true });
    }

    if (phoneModal && phoneModalOpen) {
      phoneModalOpen.addEventListener('click', () => {
        phoneModal.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
      });
      phoneModalCloseButtons.forEach((button) => {
        button.addEventListener('click', () => {
          phoneModal.classList.add('hidden');
          document.body.classList.remove('overflow-hidden');
        });
      });
    }

    if (menuModal && menuModalOpen) {
      menuModalOpen.addEventListener('click', () => {
        menuModal.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
      });
      menuModalCloseButtons.forEach((button) => {
        button.addEventListener('click', () => {
          menuModal.classList.add('hidden');
          document.body.classList.remove('overflow-hidden');
        });
      });
    }

    if (processModal && processModalOpen) {
      processModalOpen.addEventListener('click', () => {
        processModal.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
      });
      processModalCloseButtons.forEach((button) => {
        button.addEventListener('click', () => {
          processModal.classList.add('hidden');
          document.body.classList.remove('overflow-hidden');
        });
      });
    }

    const setTechTabState = (group, activeIndex) => {
      const buttons = Array.from(group.querySelectorAll('[data-tech-tab-button]'));
      const panels = Array.from(group.querySelectorAll('[data-tech-tab-panel]'));
      panels.forEach((panel, index) => {
        panel.style.display = index !== activeIndex ? 'none' : '';
      });
      buttons.forEach((button, index) => {
        const isActive = index === activeIndex;
        button.setAttribute('aria-selected', isActive ? 'true' : 'false');
        button.classList.toggle('bg-zinc-200', isActive);
        button.classList.toggle('text-zinc-900', isActive);
        button.classList.toggle('bg-white', !isActive);
        button.classList.toggle('text-zinc-600', !isActive);
      });
    };

    techTabGroups.forEach((group) => {
      const buttons = Array.from(group.querySelectorAll('[data-tech-tab-button]'));
      buttons.forEach((button, index) => {
        button.addEventListener('click', () => setTechTabState(group, index));
      });
      setTechTabState(group, 0);
    });

    document.querySelectorAll('[data-modelhouse-gallery]').forEach((gallery) => {
      const gallerySlides = Array.from(gallery.querySelectorAll('.modelhouse-slide'));
      const thumbnails = Array.from(gallery.querySelectorAll('[data-gallery-thumbnail]'));
      let activeIndex = 0;
      const setGallerySlide = (index) => {
        activeIndex = index;
        gallerySlides.forEach((slide, slideIndex) => slide.classList.toggle('is-active', slideIndex === activeIndex));
        thumbnails.forEach((thumbnail, thumbnailIndex) => {
          const isActive = thumbnailIndex === activeIndex;
          thumbnail.setAttribute('aria-current', isActive ? 'true' : 'false');
          thumbnail.classList.toggle('border-zinc-900', isActive);
          thumbnail.classList.toggle('border-transparent', !isActive);
        });
      };
      thumbnails.forEach((thumbnail, index) => thumbnail.addEventListener('click', () => setGallerySlide(index)));
      if (gallerySlides.length > 1) {
        setInterval(() => setGallerySlide((activeIndex + 1) % gallerySlides.length), 4200);
      }
    });

  </script>
</body>
</html>
